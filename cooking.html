<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cooking - Kenneth Lin</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="cooking-override.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <section class="page cooking-page active">
        <!-- Hero Split Section -->
        <div class="hero-split">
            <div class="hero-left">
                <a href="index.html" class="back-btn" aria-label="Back to Home"><i class="fas fa-arrow-left"></i> Home</a>
                <div class="hero-content">
                    <h1 class="hero-title">Cooking</h1>
                    <div class="scroll-down-arrow" style="display: flex; justify-content: center; align-items: center; margin-top: 2.5rem;">
                        <i class="fas fa-chevron-down"></i>
                    </div>
                </div>
            </div>
            <div class="hero-right">
                <div class="hero-dynamic-img-bg" style="background-image: url('images/kitchen.gif');"></div>
            </div>
        </div>
        <!-- Main Content Full Width -->
        <main class="cooking-main-content">
            <!-- Blog Section: Works Gallery -->
            <section class="cooking-blog-gallery" style="margin: 4rem auto 2.5rem auto; max-width: 900px; display: flex; flex-wrap: wrap; gap: 2.5rem; justify-content: center;">
                <div class="cooking-work-frame">
                    <img src="images/cooking_image_1.jpg" alt="Cooking Image 1" style="width:100%;height:100%;object-fit:cover;border-radius:14px;" />
                </div>
                <div class="cooking-work-frame">
                    <img src="images/cooking_image_2.jpg" alt="Cooking Image 2" style="width:100%;height:100%;object-fit:cover;border-radius:14px;" />
                </div>
                <div class="cooking-work-frame">
                    <img src="images/cooking_image_3.jpg" alt="Cooking Image 3" style="width:100%;height:100%;object-fit:cover;border-radius:14px;" />
                </div>
            </section>
            <!-- Social Section: Instagram & TikTok -->
            <section class="cooking-social-section" style="text-align: center; margin-bottom: 3rem;">
                <p style="font-size: 1.2rem; color: #fff; margin-bottom: 1.2rem;">Most of my cooking content is on Instagram and TikTok. Connect with me there!</p>
                <div class="cooking-social-icons" style="display: flex; justify-content: center; gap: 2.5rem;">
                    <a href="https://www.instagram.com/temporary_url" class="cooking-social-icon" id="insta-link" target="_blank" rel="noopener" style="font-size: 2.2rem; color: #fff; opacity: 0.85;"><i class="fab fa-instagram"></i></a>
                    <a href="https://www.tiktok.com/@kennethcooks0" class="cooking-social-icon" id="tiktok-link" target="_blank" rel="noopener" style="font-size: 2.2rem; color: #fff; opacity: 0.85;"><i class="fab fa-tiktok"></i></a>
                </div>
            </section>
        </main>
    </section>
    <script src="script.js"></script>
</body>
</html>
